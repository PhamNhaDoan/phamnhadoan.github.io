<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phạm Nhã Đoan | Home Corner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fdf8f4;
            --card-bg: #ffffff;
            --primary-coral: #ff9b85;
            --soft-orange: #ffd97d;
            --mint-green: #b5e2fa;
            --warm-brown: #6b5b52;
            --text-main: #574b44;
            --text-light: #8c7a70;
            --border-line: #f4ece4;
            --border-dotted: #f0e2d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            /* Họa tiết chấm bi chìm siêu nhẹ */
            background-image: radial-gradient(#ecc7b7 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        /* Khung chính: 1 viền mỏng nét liền bên ngoài + 1 viền dotted bên trong */
        .profile-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            padding: 35px 28px;
            border: 2px solid var(--border-line);
            outline: 2px dotted var(--border-dotted);
            outline-offset: -8px;
            text-align: center;
            position: relative;
        }

        /* Trang trí huy hiệu góc nhỏ dễ thương */
        .badge-cute {
            display: inline-block;
            background: #ffe5d9;
            color: #d97762;
            font-family: 'Comfortaa', cursive;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-coral), var(--soft-orange));
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            font-size: 1.65rem;
            color: var(--warm-brown);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 28px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            padding: 16px 22px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Nút 1: Chú Công Convert - Màu Cam Hồng */
        .btn-chucong {
            background-color: #fff1ed;
            color: #e06d53;
            border: 1.5px solid #ffd8cd;
        }

        .btn-chucong:hover {
            background-color: var(--primary-coral);
            color: #ffffff;
            border-color: var(--primary-coral);
        }

        /* Nút 2: Control Panel - Màu Xanh Mint / Sky Dịu */
        .btn-cp {
            background-color: #f0f8ff;
            color: #3b82a6;
            border: 1.5px solid #d4ebf8;
        }

        .btn-cp:hover {
            background-color: #63b3ed;
            color: #ffffff;
            border-color: #63b3ed;
        }

        /* Nút 3: Nhật Ký Đọc Sách - Màu Kem Vàng */
        .btn-note {
            background-color: #fffdf0;
            color: #b5832a;
            border: 1.5px solid #ffe8b5;
        }

        .btn-note:hover {
            background-color: var(--soft-orange);
            color: #6b5118;
            border-color: var(--soft-orange);
        }

        /* Nút 4: Đọc Online - Màu Xanh Mint */
        .btn-read {
            background-color: #f0faf7;
            color: #319795;
            border: 1.5px solid #c6f6d5;
        }

        .btn-read:hover {
            background-color: #319795;
            color: #ffffff;
            border-color: #319795;
        }

        /* Nút 5: Admin Đọc Online - Màu Tím Nhẹ */
        .btn-admin-read {
            background-color: #f8f5ff;
            color: #805ad5;
            border: 1.5px solid #e9d8fd;
        }

        .btn-admin-read:hover {
            background-color: #805ad5;
            color: #ffffff;
            border-color: #805ad5;
        }

        .btn-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        .arrow-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-link:hover .arrow-svg {
            transform: translateX(4px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.82rem;
            color: var(--text-light);
            border-top: 1px dashed #f0e2d8;
            padding-top: 18px;
        }
    </style>
</head>
<body>

    <main class="profile-card">
        <span class="badge-cute">Welcome home</span>
        
        <div class="avatar-wrapper">
            <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Nhadaon&backgroundColor=ffdfbf" alt="Phạm Nhã Đoan Avatar">
        </div>

        <h1>Phạm Nhã Đoan</h1>
        <p class="subtitle">Góc nhỏ lưu trữ & quản lý truyện cá nhân</p>

        <nav class="links-container">
            <a href="https://chucongconvert.vercel.app" class="btn-link btn-chucong" target="_blank" rel="noopener">
                <span class="btn-icon">>⩊<</span>
                <span>Trang Chucongconvert</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>

            <a href="https://phamnhadoan.github.io/cp.html" class="btn-link btn-cp">
                <span class="btn-icon">>⩊<</span>
                <span>Control Panel</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>

            <a href="https://phamnhadoan.github.io/note/" class="btn-link btn-note">
                <span class="btn-icon">>⩊<</span>
                <span>Nhật Ký Đọc Sách</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>

            <a href="https://phamnhadoan.github.io/read/index.html" class="btn-link btn-read">
                <span class="btn-icon">>⩊<</span>
                <span>Đọc Online</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>

            <a href="https://phamnhadoan.github.io/read/index5.html" class="btn-link btn-admin-read">
                <span class="btn-icon">>⩊<</span>
                <span>Admin Đọc Online</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </nav>

        <footer>
            &copy; PhamNhaDoan &bull; Little Corner
        </footer>
    </main>

</body>
</html>
