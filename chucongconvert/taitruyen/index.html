    let globalStories = [...dataStories];
    globalStories.sort((a, b) => b.id - a.id);

    function displayStories(data) {
        const tableBody = document.getElementById('storyTableBody');
        if (!tableBody) return;
        
        tableBody.innerHTML = '';
        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding: 30px;">Không thấy truyện cần tìm rồi nàng ơi...</td></tr>`;
            return;
        }
        
        data.forEach(story => {
            const genres = story.theLoai ? story.theLoai.split(',').map(g => {
                const genreName = g.trim();
                return `<span class="genre-tag" onclick="filterByGenre('${genreName}')">${genreName}</span>`;
            }).join('') : '-';
            
            const isValidLink = (link) => link && link.trim().toLowerCase().startsWith('http');

            // Xử lý nút Đọc online
            const btnDoc = isValidLink(story.linkDoc) ? `<a href="${story.linkDoc}" target="_blank" class="btn-download btn-doc">Đọc</a>` : '<span style="color:#bbb; font-style:italic;">Chưa có</span>';

     // Xử lý nút Tải về (Raw, QT) - Đổi thành button để trigger luồng tải ngầm
const btnRaw = isValidLink(story.linkRaw) 
    ? `<button onclick="triggerDirectDownload('${story.linkRaw}', '${story.ten.replace(/'/g, "\\'")}.txt')" class="btn-download btn-raw">⭳ Raw</button>` 
    : '';

const btnQT = isValidLink(story.linkQT) 
    ? `<button onclick="triggerDirectDownload('${story.linkQT}', '${story.ten.replace(/'/g, "\\'")}.epub')" class="btn-download btn-qt">⭳ QT</button>` 
    : '';

const downloadCell = (btnRaw || btnQT) 
    ? `${btnRaw} ${btnQT}` 
    : '<span style="color:#bbb; font-style:italic;">Chưa có</span>';

            const row = `
                <tr>
                    <td class="story-title">${story.ten || '-'}</td>
                    <td class="author-name">${story.tacGia || '-'}</td>
                    <td>${genres}</td>
                    <td class="notes-text">${story.ghiChu || '-'}</td>
                    <td style="text-align: center; white-space: nowrap;">${btnDoc}</td>
                    <td style="text-align: center; white-space: nowrap;">${downloadCell}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    function filterByGenre(genreName) {
        const searchBar = document.getElementById('searchBar');
        if (searchBar) {
            searchBar.value = genreName;
            const keyword = genreName.toLowerCase();
            const filtered = globalStories.filter(story => 
                (story.ten && story.ten.toLowerCase().includes(keyword)) || 
                (story.tacGia && story.tacGia.toLowerCase().includes(keyword)) || 
                (story.theLoai && story.theLoai.toLowerCase().includes(keyword))
            );
            displayStories(filtered);
            searchBar.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function initStories() {
        displayStories(globalStories);

        const searchBar = document.getElementById('searchBar');
        if (searchBar) {
            searchBar.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                const filtered = globalStories.filter(story => 
                    (story.ten && story.ten.toLowerCase().includes(keyword)) || 
                    (story.tacGia && story.tacGia.toLowerCase().includes(keyword)) || 
                    (story.theLoai && story.theLoai.toLowerCase().includes(keyword))
                );
                displayStories(filtered);
            });
        }
    }

    window.onload = initStories;
    async function triggerDirectDownload(url, defaultFileName) {
    let fileName = defaultFileName;
    
    try {
        const urlObj = new URL(url);
        const params = new URLSearchParams(urlObj.search);
        
        // Lấy tên file gốc từ tham số ?filename= nếu có
        if (params.get('filename')) {
            fileName = decodeURIComponent(params.get('filename'));
        } else {
            // Nếu dính link Google Drive (không fetch blob được do bảo mật CORS), mở tab mới dự phòng
            if (url.includes('drive.google.com')) {
                window.open(url, '_blank');
                return;
            }
            fileName = url.substring(url.lastIndexOf('/') + 1) || defaultFileName;
        }
    } catch (e) {
        window.open(url, '_blank');
        return;
    }

    try {
        // Bắt đầu luồng tải ngầm giống hệt công cụ của bà
        const fileResponse = await fetch(url);
        if (!fileResponse.ok) throw new Error("Tải file thất bại");
        const blob = await fileResponse.blob();
        
        const tempLink = document.createElement('a');
        tempLink.href = window.URL.createObjectURL(blob);
        tempLink.setAttribute('download', fileName);
        document.body.appendChild(tempLink);
        tempLink.click();
        
        document.body.removeChild(tempLink);
        window.URL.revokeObjectURL(tempLink.href);
    } catch (err) {
        // Nếu trình duyệt chặn do lỗi CORS hoặc lỗi mạng, tự động mở tab mới để chữa cháy
        window.open(url, '_blank');
        console.error(err);
    }
}
