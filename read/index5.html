<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Read - Thêm Truyện Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fdf8f4;
            --card-bg: #ffffff;
            --warm-brown: #6b5b52;
            --text-light: #8c7a70;
            --border-line: #f4ece4;
            --coral-text: #e06d53;
            --coral-bg: #fff1ed;
            --blue-text: #3b82a6;
            --shadow-soft: 0 10px 25px rgba(232, 180, 160, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-page);
            color: var(--warm-brown);
            padding: 35px 15px;
            min-height: 100vh;
            background-image: radial-gradient(#ecc7b7 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 30px;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--border-line);
            outline: 2px dashed #f0e2d8;
            outline-offset: -8px;
        }

        h2 {
            font-family: 'Comfortaa', cursive;
            color: var(--coral-text);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--warm-brown);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-line);
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
            color: var(--warm-brown);
        }

        input:focus, textarea:focus { border-color: var(--coral-text); }

        textarea { resize: vertical; }

        .submit-btn {
            width: 100%;
            background-color: var(--coral-bg);
            color: var(--coral-text);
            border: 1.5px solid #ffd8cd;
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background-color: var(--coral-text);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(224, 109, 83, 0.3);
        }

        .status-msg {
            margin-top: 18px;
            text-align: center;
            font-weight: 700;
            word-break: break-all;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Read - Thêm Truyện Mới</h2>

    <form id="addStoryForm" onsubmit="handlePostStory(event)">
        <div class="form-group">
            <label>GitHub Personal Access Token</label>
            <input type="password" id="githubToken" placeholder="Nhập Token GitHub..." required>
        </div>

        <div class="form-group">
            <label>Tên Truyện</label>
            <input type="text" id="storyTitle" placeholder="Nhập tên truyện..." required>
        </div>

        <div class="form-group">
            <label>Tác Giả</label>
            <input type="text" id="storyAuthor" placeholder="Nhập tên tác giả..." required>
        </div>

        <div class="form-group">
            <label>Ghi Chú / Tóm Tắt Khái Quát</label>
            <textarea id="storySummary" rows="3" placeholder="Nhập tóm tắt hoặc ghi chú ngắn..."></textarea>
        </div>

        <div class="form-group">
            <label>Link Đọc Truyện</label>
            <input type="text" id="storyReadUrl" placeholder="Ví dụ: https://chucongconvert.vercel.app/... hoặc link trang đọc" required>
        </div>

        <div class="form-group">
            <label>Link URL Ảnh Bìa (Tùy chọn)</label>
            <input type="text" id="storyCover" placeholder="https://domain.com/anh-bia.jpg">
        </div>

        <button type="submit" class="submit-btn">Cập Nhật Vào Read/Index.html</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    const githubAcc = "PhamNhaDoan";
    const repo = "phamnhadoan.github.io";

    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('gh_token_reviewconvert');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
    });

    async function handlePostStory(e) {
        e.preventDefault();
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.color = '#333';
        statusMsg.textContent = 'Đang đọc dữ liệu từ read/index.html trên GitHub...';

        const token = document.getElementById('githubToken').value.trim();
        const title = document.getElementById('storyTitle').value.trim();
        const author = document.getElementById('storyAuthor').value.trim();
        const summary = document.getElementById('storySummary').value.trim();
        const readUrl = document.getElementById('storyReadUrl').value.trim();
        let coverUrl = document.getElementById('storyCover').value.trim();

        if (!coverUrl) {
            coverUrl = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400';
        }

        localStorage.setItem('gh_token_reviewconvert', token);

        // Khung bài đăng truyện mới theo chuẩn giao diện read/index.html
        const newStoryCardHtml = `<article class="story-card">
            <div class="cover-wrapper">
                <img src="${coverUrl}" alt="Bìa truyện" class="cover-img">
            </div>
            <div class="story-info">
                <h3 class="story-name">${escapeHtml(title)}</h3>
                <div class="story-author">Tác giả: ${escapeHtml(author)}</div>
                ${summary ? `<div class="story-note">${escapeHtml(summary)}</div>` : ''}
                <a href="${readUrl}" class="read-now-btn" target="_blank" rel="noopener">Đọc truyện ngay →</a>
            </div>
        </article>`;

        try {
            // 1. Tải file read/index.html từ GitHub
            const indexPath = 'read/index.html';
            const indexApiUrl = `https://api.github.com/repos/${githubAcc}/${repo}/contents/${indexPath}`;

            const getIndexRes = await fetch(indexApiUrl, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!getIndexRes.ok) {
                throw new Error('Không thể tải file read/index.html từ GitHub. Kiểm tra lại Token!');
            }

            const indexFileData = await getIndexRes.json();
            const currentSha = indexFileData.sha;
            const currentIndexHtml = decodeURIComponent(escape(atob(indexFileData.content)));

            // 2. Chèn bài mới vào ngay sau <div id="story-list">
            const targetTag = '<div id="story-list">';
            if (!currentIndexHtml.includes(targetTag)) {
                throw new Error('Không tìm thấy thẻ <div id="story-list"> trong file read/index.html');
            }

            const updatedIndexHtml = currentIndexHtml.replace(
                targetTag,
                targetTag + '\n\n        ' + newStoryCardHtml
            );

            // 3. Đẩy file read/index.html mới lên GitHub
            statusMsg.textContent = 'Đang thêm truyện mới lên đầu trang read/index.html...';
            const putIndexRes = await fetch(indexApiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Thêm truyện mới vào read: ${title}`,
                    content: btoa(unescape(encodeURIComponent(updatedIndexHtml))),
                    sha: currentSha
                })
            });

            if (putIndexRes.ok) {
                statusMsg.style.color = 'green';
                statusMsg.innerHTML = `Thêm truyện "${title}" thành công!<br><a href="https://${githubAcc.toLowerCase()}.github.io/read/index.html" target="_blank" style="color:#e06d53;">Xem Trang Danh Sách Read/Index</a>`;
                
                // Reset form
                document.getElementById('storyTitle').value = '';
                document.getElementById('storyAuthor').value = '';
                document.getElementById('storySummary').value = '';
                document.getElementById('storyReadUrl').value = '';
                document.getElementById('storyCover').value = '';
            } else {
                throw new Error('Lỗi khi ghi đè file read/index.html lên GitHub.');
            }

        } catch (err) {
            statusMsg.style.color = 'red';
            statusMsg.textContent = 'Lỗi: ' + err.message;
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
