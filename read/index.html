<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Truyện Mới Nhất</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dots: #c2b280;
            --cream-bg: rgba(253, 251, 247, 0.94);
            --border-dash: #a89f91;
            --primary-color: #d76a03;
            --accent-green: #4f6d7a;
            --text-color: #2b2d42;
            --card-shadow: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            color: var(--text-color);
            background-color: #f4f1ea;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
            line-height: 1.6;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px dashed var(--border-dash);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        header p {
            color: var(--accent-green);
            font-weight: 600;
            margin: 0;
            font-style: italic;
        }

        /* Danh sách chứa các khung truyện */
        #story-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Khung truyện hàng ngang (Card) */
        .story-card {
            background-color: var(--cream-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 6px 18px var(--card-shadow);
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 22px;
            align-items: start;
            transition: transform 0.2s ease;
        }

        .story-card:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .story-card {
                grid-template-columns: 1fr;
            }
        }

        /* Khung ảnh bìa */
        .cover-wrapper {
            width: 100%;
            height: 220px;
            border: 1px dashed var(--border-dash);
            padding: 4px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Khung thông tin truyện */
        .story-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .story-title {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
        }

        .story-title a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .story-title a:hover {
            color: #b55802;
        }

        .story-author {
            font-size: 0.95rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .story-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px;
        }

        .tag-item {
            background: #e2ddd5;
            color: var(--text-color);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .story-summary {
            background: rgba(255, 255, 255, 0.75);
            border-left: 3px solid var(--primary-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.92rem;
            color: #555;
            font-style: italic;
            margin-top: 4px;
            line-height: 1.5;
        }

        .read-btn {
            align-self: flex-start;
            margin-top: 10px;
            background: var(--accent-green);
            color: #fff;
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .read-btn:hover {
            background: #3b535e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tủ Truyện Chọn Lọc</h1>
        <p>Cập nhật những bộ truyện mới nhất</p>
    </header>

    <!-- Thẻ chứa danh sách truyện -->
    <main id="story-list">

       

        <!-- Mẫu 1 khung truyện (Bài mới đăng qua Admin sẽ tự động chèn lên phía trên dòng này) -->
        <article class="story-card">
            <div class="cover-wrapper">
                <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400" alt="Bìa truyện" class="cover-img">
            </div>
            <div class="story-info">
                <h2 class="story-title"><a href="read/truyen-mau.html">Ví dụ</a></h2>
                <div class="story-author">Tác giả: Tui</div>
                <div class="story-tags">
                    <span class="tag-item">Thụ sủng công</span>
                    <span class="tag-item">Cổ đại</span>
                    <span class="tag-item">Sủng</span>
                </div>
                <div class="story-summary">
                    Giới thiệu: Cái này là thử thôi, đừng quan tâm
                </div>
                <a href="read/truyen-mau.html" class="read-btn">Đọc Truyện →</a>
            </div>
        </article>

    </main>
</div>

</body>
</html>
