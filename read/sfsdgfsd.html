<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sfsdgfsd - Đọc Truyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dots: #c2b280;
            --cream-bg: rgba(253, 251, 247, 0.94);
            --border-dash: #a89f91;
            --primary-color: #d76a03;
            --accent-green: #4f6d7a;
            --text-color: #2b2d42;
            --card-shadow: rgba(0, 0, 0, 0.05);
            --reader-bg: #f4f1ea;
        }

        body.theme-cream {
            background-color: #f4f1ea;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
            color: #2b2d42;
        }

        body.theme-white { background-color: #ffffff; background-image: none; color: #111111; }
        body.theme-dark { background-color: #1a1a1a; background-image: none; color: #d1d5db; }

        * { box-sizing: border-box; }

        body { font-family: 'Nunito', sans-serif; margin: 0; padding: 40px 15px; line-height: 1.6; transition: background 0.3s, color 0.3s; }
        .container { max-width: 850px; margin: 0 auto; }

        .story-container {
            background-color: var(--cream-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 8px 24px var(--card-shadow);
        }

        .story-header {
            border-bottom: 1px dashed var(--border-dash);
            padding-bottom: 20px; margin-bottom: 20px;
            display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: start;
        }

        @media (max-width: 600px) { .story-header { grid-template-columns: 1fr; } }

        .cover-wrapper {
            width: 100%; height: 250px; border: 1px dashed var(--border-dash);
            padding: 5px; border-radius: 10px; background: #fff;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .cover-img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .story-title-group { display: flex; flex-direction: column; gap: 8px; }
        .story-title { font-size: 1.8rem; color: var(--primary-color); margin: 0; font-weight: 700; }
        .story-author { font-size: 1.05rem; color: var(--accent-green); font-weight: 600; }

        .story-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .tag-item { background: #e2ddd5; color: var(--text-color); padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }

        .story-summary {
            background: rgba(255, 255, 255, 0.7); border-left: 3px solid var(--primary-color);
            padding: 10px 14px; border-radius: 4px; font-size: 0.95rem; color: #555; font-style: italic; margin-top: 6px;
        }

        .chapter-nav { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .chapter-btn {
            padding: 6px 16px; border: 1px solid var(--border-dash); background: #fff;
            border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.95rem; font-weight: 600;
        }
        .chapter-btn.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

        .story-content { font-size: 1.2rem; line-height: 1.65; text-align: justify; white-space: pre-wrap; margin-bottom: 25px; min-height: 120px; }

        /* KHUNG BÌNH LUẬN MYSQL */
        .comments-section { margin-top: 35px; padding-top: 25px; border-top: 2px dashed #a89f91; }
        .comments-title { font-size: 1.25rem; color: #4f6d7a; margin-bottom: 15px; font-weight: 700; }
        .comment-form, .reply-form {
            background: rgba(255, 255, 255, 0.85); border: 1px solid #e0d8cd;
            border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .comment-form input, .comment-form textarea, .reply-form input, .reply-form textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; background: #fff;
        }
        .comment-submit-btn, .reply-submit-btn {
            align-self: flex-start; background: #4f6d7a; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }
        .comment-item { background: #fff; border: 1px solid #e5e0d8; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
        .comment-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .comment-author { font-weight: 700; color: #d76a03; font-size: 0.95rem; }
        .comment-time { font-size: 0.78rem; color: #888; }
        .comment-text { font-size: 0.95rem; color: #333; line-height: 1.5; white-space: pre-wrap; }
        .reply-action-btn { background: transparent; border: none; color: #4f6d7a; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 6px; }
        .replies-list { margin-top: 10px; margin-left: 20px; padding-left: 12px; border-left: 2px solid #e2ddd5; display: flex; flex-direction: column; gap: 8px; }
        .reply-item { background: #fdfbf7; border: 1px solid #ede8e0; border-radius: 8px; padding: 10px 12px; }
    </style>
</head>
<body class="theme-cream">

<div class="container">
    <article class="story-container">
        <div class="story-header">
            <div class="cover-wrapper">
                <img src="https://plus.unsplash.com/premium_photo-1671105035576-cc0ef98ae2dd?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8" alt="Bìa truyện" class="cover-img">
            </div>
            <div class="story-title-group">
                <h1 class="story-title">sfsdgfsd</h1>
                <div class="story-author">Tác giả: hnbgfcjfhj</div>
                <div class="story-tags"><span class="tag-item">bgfb</span></div>
                <div class="story-summary">Giới thiệu: dfxhbdfgnhb</div>
            </div>
        </div>

        <div class="chapter-nav" id="chapterNav">
            <button class="chapter-btn active" data-chap-id="ch1" onclick="switchChapter(this, 'ch1')">Chương 1</button>
                <button class="chapter-btn " data-chap-id="ch2" onclick="switchChapter(this, 'ch2')">Chương 2</button>
        </div>

        <div class="story-content" id="story-content-body">fgxhnfgjn</div>

        <!-- BÌNH LUẬN DÙNG MYSQL INFINITYFREE -->
        <div class="comments-section">
            <h3 class="comments-title">💬 Bình Luận Của Độc Giả</h3>
            <form class="comment-form" onsubmit="handlePostComment(event)">
                <input type="text" id="guestName" placeholder="Tên của bạn..." required>
                <textarea id="guestContent" placeholder="Viết bình luận tại đây..." rows="3" required></textarea>
                <button type="submit" class="comment-submit-btn">Gửi Bình Luận</button>
            </form>
            <div id="commentsList" class="comments-list">Đang tải bình luận...</div>
        </div>
    </article>
</div>

<script>
    const storyId = 'sfsdgfsd';
    const storyData = [{"id":"ch1","title":"Chương 1","content":"fgxhnfgjn"},{"id":"ch2","title":"Chương 2","content":"nhcfjhgmk"}];
    const apiBaseUrl = 'https://chucongconvert.gt.tc/read/comment_api.php';

    function switchChapter(btn, cId) {
        document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const found = storyData.find(item => item.id === cId);
        if (found) document.getElementById('story-content-body').textContent = found.content;
    }

    document.addEventListener('DOMContentLoaded', fetchComments);

    async function fetchComments() {
        const container = document.getElementById('commentsList');
        try {
            const res = await fetch(`${apiBaseUrl}?story_id=${storyId}`);
            const result = await res.json();
            if (!result.success || !result.data.length) {
                container.innerHTML = '<p style="color:#888;">Chưa có bình luận nào. Hãy là người đầu tiên bình luận!</p>';
                return;
            }
            container.innerHTML = result.data.map(c => {
                let repliesHtml = '';
                if (c.replies && c.replies.length > 0) {
                    repliesHtml = '<div class="replies-list">' + c.replies.map(r => `
                        <div class="reply-item">
                            <div class="comment-meta">
                                <span class="comment-author">${r.author}</span>
                                <span class="comment-time">${r.time}</span>
                            </div>
                            <div class="comment-text">${r.content}</div>
                        </div>
                    `).join('') + '</div>';
                }
                return `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-author">${c.author}</span>
                            <span class="comment-time">${c.time}</span>
                        </div>
                        <div class="comment-text">${c.content}</div>
                        <button class="reply-action-btn" onclick="toggleReplyForm(${c.id})">↳ Phản hồi</button>
                        <form id="replyForm_${c.id}" class="reply-form" style="display:none; margin-top:10px;" onsubmit="handlePostReply(event, ${c.id})">
                            <input type="text" class="reply-name" placeholder="Tên của bạn..." required>
                            <textarea class="reply-text" placeholder="Viết phản hồi..." rows="2" required></textarea>
                            <button type="submit" class="reply-submit-btn">Gửi Phản Hồi</button>
                        </form>
                        ${repliesHtml}
                    </div>
                `;
            }).join('');
        } catch (err) {
            container.innerHTML = '<p style="color:red;">Lỗi tải bình luận từ server!</p>';
        }
    }

    async function handlePostComment(e) {
        e.preventDefault();
        const author = document.getElementById('guestName').value.trim();
        const content = document.getElementById('guestContent').value.trim();
        const res = await fetch(apiBaseUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ story_id: storyId, parent_id: 0, author, content })
        });
        const result = await res.json();
        if (result.success) {
            document.getElementById('guestContent').value = '';
            fetchComments();
        } else { alert(result.message); }
    }

    function toggleReplyForm(id) {
        const form = document.getElementById(`replyForm_${id}`);
        form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    }

    async function handlePostReply(e, parentId) {
        e.preventDefault();
        const form = document.getElementById(`replyForm_${parentId}`);
        const author = form.querySelector('.reply-name').value.trim();
        const content = form.querySelector('.reply-text').value.trim();
        const res = await fetch(apiBaseUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ story_id: storyId, parent_id: parentId, author, content })
        });
        const result = await res.json();
        if (result.success) { fetchComments(); } else { alert(result.message); }
    }
</script>

</body>
</html>
