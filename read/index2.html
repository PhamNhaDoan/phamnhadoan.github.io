<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Truyện - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dots: #c2b280;
            --cream-bg: rgba(253, 251, 247, 0.95);
            --border-dash: #a89f91;
            --primary-color: #d76a03;
            --accent-green: #4f6d7a;
            --text-color: #2b2d42;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            color: var(--text-color);
            background-color: #f4f1ea;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--cream-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--accent-green);
        }

        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }

        .chapter-box {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .chapter-box textarea {
            width: 100%;
            height: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            margin-top: 6px;
            outline: none;
        }

        .add-chap-btn {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 22px;
            transition: background 0.2s;
        }

        .add-chap-btn:hover {
            background: #3b535e;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #b55802;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Đăng Truyện Mới Up GitHub</h2>
    <form id="postStoryForm" onsubmit="handlePostStory(event)">
        
        <div class="form-group">
            <label>Tên Repo</label>
            <input type="text" id="repoName" value="https://phamnhadoan.github.io/" required>
        </div>

        <div class="form-group">
            <label>Tên Tài Khoản GitHub</label>
            <input type="text" id="githubAcc" value="PhamNhaDoan" required>
        </div>

        <div class="form-group">
            <label>GitHub Key Token</label>
            <input type="password" id="githubToken" placeholder="Nhập Personal Access Token..." required>
        </div>

        <div class="form-group">
            <label>Tên Truyện</label>
            <input type="text" id="storyTitle" placeholder="Nhập tên truyện..." required>
        </div>

        <div class="form-group">
            <label>Tác Giả</label>
            <input type="text" id="storyAuthor" placeholder="Nhập tên tác giả..." required>
        </div>

        <!-- Bìa Truyện -->
        <div class="form-group">
            <label>Upload Ảnh Bìa Truyện (Từ máy)</label>
            <input type="file" id="coverFile" accept="image/*">
        </div>

        <div class="form-group">
            <label>Hoặc Dán URL Bìa Truyện</label>
            <input type="text" id="coverUrl" placeholder="https://domain.com/anh-bia.jpg">
        </div>

        <hr style="border: 0; border-top: 1px dashed var(--border-dash); margin: 25px 0;">

        <div id="chaptersContainer">
            <div class="chapter-box">
                <div class="form-group" style="margin-bottom: 6px;">
                    <label>Tên / Số Chương (Phần 1)</label>
                    <input type="text" class="chap-title" value="Chương 1" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Nội Dung</label>
                    <textarea class="chap-content" placeholder="Nhập nội dung chương 1..." required></textarea>
                </div>
            </div>
        </div>

        <button type="button" class="add-chap-btn" onclick="addChapterBox()">+ Thêm Phần Hoặc Chương</button>

        <button type="submit" class="submit-btn">Đăng Bài Lên GitHub</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

<script>
    let chapterCount = 1;

    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('gh_token_reviewconvert');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
    });

    function addChapterBox() {
        chapterCount++;
        const container = document.getElementById('chaptersContainer');
        const box = document.createElement('div');
        box.className = 'chapter-box';
        box.innerHTML = `
            <div class="form-group" style="margin-bottom: 6px;">
                <label>Tên / Số Chương (Phần ${chapterCount})</label>
                <input type="text" class="chap-title" value="Chương ${chapterCount}" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Nội Dung</label>
                <textarea class="chap-content" placeholder="Nhập nội dung chương ${chapterCount}..." required></textarea>
            </div>
        `;
        container.appendChild(box);
    }

    function getCoverSrc() {
        return new Promise((resolve) => {
            const fileInput = document.getElementById('coverFile');
            const urlInput = document.getElementById('coverUrl').value.trim();

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    resolve(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput !== '') {
                resolve(urlInput);
            } else {
                // Bìa mặc định nếu trống
                resolve('https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400');
            }
        });
    }

    async function handlePostStory(e) {
        e.preventDefault();
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.color = '#333';
        statusMsg.textContent = 'Đang xử lý đăng bài...';

        const githubAcc = document.getElementById('githubAcc').value.trim();
        const token = document.getElementById('githubToken').value.trim();
        const title = document.getElementById('storyTitle').value.trim();
        const author = document.getElementById('storyAuthor').value.trim();
        const coverSrc = await getCoverSrc();

        localStorage.setItem('gh_token_reviewconvert', token);

        const repo = "reviewconvert";

        const chapBoxes = document.querySelectorAll('.chapter-box');
        const chapters = [];
        chapBoxes.forEach((box, idx) => {
            const chapTitle = box.querySelector('.chap-title').value.trim();
            const chapContent = box.querySelector('.chap-content').value.trim();
            chapters.push({ id: `ch${idx + 1}`, title: chapTitle, content: chapContent });
        });

        const storyId = 'story-' + Date.now();

        let chapBtnsHtml = chapters.map((ch, idx) => 
            `<button class="chapter-btn ${idx === 0 ? 'active' : ''}" onclick="switchChapterCustom(this, '${storyId}', '${ch.id}')">${ch.title}</button>`
        ).join('\n                ');

        let chapDataScript = `
            <script>
                if(!window.storyData) window.storyData = {};
                window.storyData['${storyId}'] = ${JSON.stringify(chapters)};
                function switchChapterCustom(btn, sId, cId) {
                    const nav = btn.parentElement;
                    nav.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const contentDiv = nav.parentElement.querySelector('.story-content');
                    const data = window.storyData[sId] || [];
                    const found = data.find(item => item.id === cId);
                    if(found) {
                        contentDiv.textContent = found.content;
                    }
                }
            <\/script>
        `;

        const newPostHtml = `
        <article class="story-container" data-story-id="${storyId}">
            <div class="story-header">
                <div class="cover-wrapper">
                    <img src="${coverSrc}" alt="Bìa truyện" class="cover-img">
                </div>
                <div class="story-title-group">
                    <h2 class="story-title">${escapeHtml(title)}</h2>
                    <div class="story-author">Tác giả: ${escapeHtml(author)}</div>
                    <button class="bookmark-btn" onclick="toggleBookmark('${storyId}')">
                        <span class="bm-icon">★</span> <span class="bm-text">Bookmark</span>
                    </button>
                </div>
            </div>

            <div class="chapter-nav">
                ${chapBtnsHtml}
            </div>

            <div class="story-content" id="content-${storyId}">
                ${escapeHtml(chapters[0].content)}
            </div>

            <div class="comments-section">
                <h3 class="comments-title">Bình luận</h3>
                <form class="comment-form" onsubmit="addComment(event, this)">
                    <input type="text" placeholder="Tên khách..." required class="comment-name-input">
                    <textarea placeholder="Nội dung bình luận..." required class="comment-text-input"></textarea>
                    <button type="submit">Gửi bình luận</button>
                </form>

                <div class="comments-list"></div>
            </div>
            ${chapDataScript}
        </article>
        `;

        try {
            const apiUrl = `https://api.github.com/repos/${githubAcc}/${repo}/contents/doc_truyen.html`;
            const getRes = await fetch(apiUrl, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!getRes.ok) {
                throw new Error('Không thể tải file doc_truyen.html. Vui lòng kiểm tra lại Key Token hoặc tên Repo.');
            }

            const fileData = await getRes.json();
            const currentContent = decodeURIComponent(escape(atob(fileData.content)));

            const targetTag = '<main id="story-list-container">';
            if (!currentContent.includes(targetTag)) {
                throw new Error('Không tìm thấy vị trí chèn <main id="story-list-container"> trong file doc_truyen.html');
            }

            const updatedContent = currentContent.replace(targetTag, targetTag + '\n' + newPostHtml);

            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Đăng truyện mới: ${title}`,
                    content: btoa(unescape(encodeURIComponent(updatedContent))),
                    sha: fileData.sha
                })
            });

            if (putRes.ok) {
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'Đã đăng bài thành công lên GitHub!';
            } else {
                const errData = await putRes.json();
                throw new Error(errData.message || 'Lỗi khi commit file lên GitHub.');
            }
        } catch (err) {
            statusMsg.style.color = 'red';
            statusMsg.textContent = 'Lỗi: ' + err.message;
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
