<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sách Đã Dịch - PhamNhaDoan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dots: #c2b280;
            --cream-bg: rgba(253, 251, 247, 0.95);
            --border-dash: #a89f91;
            --primary-orange: #d76a03;
            --accent-green: #4f6d7a;
            --text-color: #2b2d42;
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            color: var(--text-color);
            background-color: #f4f1ea;
            background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
            padding: 40px 15px;
            line-height: 1.6;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            background-color: var(--cream-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: var(--card-shadow);
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-orange);
            margin-bottom: 6px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--accent-green);
            font-weight: 600;
            font-style: italic;
            font-size: 1.05rem;
        }

        /* Lưới 2 đến 3 ô trên 1 hàng */
        #book-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        @media (max-width: 900px) {
            #book-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #book-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Thẻ ô sách (Card) */
        .book-card {
            background-color: var(--cream-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
        }

        .cover-wrapper {
            width: 100%;
            height: 260px;
            border: 1px dashed var(--border-dash);
            padding: 4px;
            border-radius: 10px;
            background: #fff;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .book-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1.25rem;
            color: var(--primary-orange);
            font-weight: 800;
            line-height: 1.3;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .book-genre {
            font-size: 0.82rem;
            background: #e2ddd5;
            color: var(--text-color);
            padding: 2px 10px;
            border-radius: 12px;
            align-self: flex-start;
            font-weight: 600;
        }

        .book-summary {
            background: rgba(255, 255, 255, 0.75);
            border-left: 3px solid var(--primary-orange);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #555;
            font-style: italic;
            margin-top: 6px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .read-btn {
            align-self: flex-start;
            background: var(--accent-green);
            color: #fff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            border: 1.5px solid #2b2d42;
            box-shadow: 2.5px 2.5px 0px #2b2d42;
            transition: all 0.15s ease-in-out;
            display: inline-block;
        }

        .read-btn:hover {
            background: #3b535e;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #2b2d42;
        }

        .read-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #2b2d42;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px dashed var(--border-dash);
            padding-top: 20px;
            font-size: 0.9rem;
            color: #777;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Danh Sách Sách Đã Dịch</h1>
        <p>Các tác phẩm đã được dịch sang tiếng Việt</p>
    </header>

    <!-- Thẻ chứa danh sách ô sách -->
    <main id="book-grid">

        <article class="book-card">
            <div>
                <div class="cover-wrapper">
                    <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400" alt="Bìa sách" class="cover-img">
                </div>
                <div class="book-info">
                    <h2 class="book-title">Tên Sách Mẫu</h2>
                    <div class="book-author">Tác giả: Tên Tác Giả</div>
                    <span class="book-genre">Thể loại: Văn học</span>
                    <div class="book-summary">
                        Giới thiệu ngắn về cuốn sách đã dịch. Giới thiệu tổng quan nội dung tác phẩm.
                    </div>
                </div>
            </div>
            <a href="https://phamnhadoan.github.io/read/" class="read-btn" target="_blank" rel="noopener">Đọc bản tiếng Việt</a>
        </article>

    </main>

    <footer>
        PhamNhaDoan &copy; Translated Books Catalog
    </footer>
</div>

</body>
</html>
