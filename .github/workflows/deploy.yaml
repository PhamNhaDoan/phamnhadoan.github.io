name: Deploy GitHub Pages site

on:
  push:
    branches: ["main"]

# 🔴 THÊM ĐOẠN PHÂN QUYỀN NÀY ĐỂ SỬA LỖI ID-TOKEN
permissions:
  contents: read
  pages: write
  id-token: write # 👈 QUAN TRỌNG: Cấp quyền ghi ID Token cho GITHUB_TOKEN

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Cập nhật lên v3/v4 mới nhất
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5